services:
  # ── Streamlit app — interface DynaStasie (port 8501) ──────────────────────
  # Accès local : http://localhost:8501
  streamlit:
    build:
      context: .
      # runtime (défaut) ou adb : ajoute adb pour la synchro du temps d'écran Android
      target: ${DYNASTASIS_TARGET:-runtime}
    container_name: dynastasie-streamlit
    restart: always
    user: "${DYNASTASIS_UID:-1000}:${DYNASTASIS_GID:-1000}"
    ports:
      - "8501:8501"
    dns:
      - ${DYNASTASIS_DNS:-8.8.8.8}
    environment:
      DYNASTASIS_DB: /app/dbdata/dynastasie.db
    # Secrets : fichier hors dépôt (chmod 600), jamais monté dans l'image
    # Fichier facultatif : sans lui, l'application tourne sans aucune source externe.
    env_file:
      - path: ${DYNASTASIS_ENV_FILE:-${HOME}/.config/dynastasie/secrets.env}
        required: false
    volumes:
      - ./data:/app/data
      # La base vit dans un dossier dédié : ne PAS monter ./db sur /app/db, sinon le schéma et
      # les migrations du dossier de travail (peut-être en cours de modification) écrasent ceux de l'image.
      - ./db:/app/dbdata
      - ./config:/app/config:ro
      - ./.streamlit/config.toml:/app/.streamlit/config.toml
      - ./.streamlit/themes:/app/.streamlit/themes
    command: ["streamlit", "run", "src/app/ui_main.py"]
